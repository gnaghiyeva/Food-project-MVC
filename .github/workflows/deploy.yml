name: Deploy to Oracle

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload JAR to Oracle
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "*.jar.original" | head -n 1)

          echo "Uploading $JAR_FILE"

          scp -i ~/.ssh/deploy_key "$JAR_FILE" \
            "$SERVER_USER@$SERVER_HOST:/home/ubuntu/Food-project-MVC/app-new.jar"

      - name: Deploy Docker container
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" 'bash -s' << 'EOF'
            set -e

            cd /home/ubuntu/Food-project-MVC

            docker compose build app
            docker compose up -d --no-deps app

            echo "Waiting for application to start..."

            SUCCESS=0

            for i in $(seq 1 20); do
              if curl -fsS http://localhost:9595/ >/dev/null 2>&1; then
                SUCCESS=1
                break
              fi

              echo "Waiting... ($i/20)"
              sleep 5
            done

            if [ "$SUCCESS" -eq 1 ]; then
              echo "Application is running successfully!"
              docker ps
              exit 0
            fi

            echo "Application failed to start."
            docker logs --tail=100 food-app
            exit 1
          EOF