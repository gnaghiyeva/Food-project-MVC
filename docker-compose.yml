services:
  db:
    image: postgres:16-alpine
    container_name: food-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-yummyfood}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2209}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-yummyfood}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: food-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-yummyfood}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-2209}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "9595:9595"
    volumes:
      - uploads-data:/app/uploads

volumes:
  db-data:
  uploads-data:
