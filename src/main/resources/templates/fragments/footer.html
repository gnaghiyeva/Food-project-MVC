
<!--Footer-->
<footer id="footer" class="footer dark-background" th:fragment="footer">

    <div class="container" th:each="contact : ${contact}">
        <div class="row gy-3">

            <div class="col-lg-3 col-md-6 d-flex">
                <i class="bi bi-geo-alt icon"></i>

                <div class="address">
                    <h4>Address</h4>
                    <p th:text="${contact.address}">A108 Adam Street</p>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 d-flex">
                <i class="bi bi-telephone icon"></i>

                <div>
                    <h4>Contact</h4>
                    <p>
                        <strong>Phone:</strong>
                        <span th:text="${contact.phone}">+1 5589 55488 55</span>
                        <br>

                        <strong>Email:</strong>
                        <span th:text="${contact.email}">info@example.com</span>
                        <br>
                    </p>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 d-flex">
                <i class="bi bi-clock icon"></i>

                <div>
                    <h4>Opening Hours</h4>
                    <p th:utext="${contact.openingHour}">
                        <strong>Mon-Sat:</strong> 11AM - 23PM<br>
                        <strong>Sunday:</strong> Closed
                    </p>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <h4>Follow Us</h4>

                <div class="social-links d-flex">
                    <a th:href="${contact.xLink}" class="twitter">
                        <i class="bi bi-twitter-x"></i>
                    </a>

                    <a th:href="${contact.facebookLink}" class="facebook">
                        <i class="bi bi-facebook"></i>
                    </a>

                    <a th:href="${contact.instagramLink}" class="instagram">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a th:href="${contact.linkedinLink}" class="linkedin">
                        <i class="bi bi-linkedin"></i>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <div class="container copyright text-center mt-4">
        <p>© <span>Copyright</span> <strong class="px-1 sitename">Yummy</strong> <span>All Rights Reserved</span></p>
        <div class="credits">
            <!-- All the links in the footer should remain intact. -->
            <!-- You can delete the links only if you've purchased the pro version. -->
            <!-- Licensing information: https://bootstrapmade.com/license/ -->
            <!-- Purchase the pro version with working PHP/AJAX contact form: [buy-url] -->
            Designed by <a href="https://bootstrapmade.com/">BootstrapMade</a> Distributed by <a href="https://themewagon.com">ThemeWagon</a>
        </div>
    </div>

</footer>
