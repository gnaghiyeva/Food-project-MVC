<html
        xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/dashboard/layout}" lang="en">
<head>
    <title>Update Event</title>
</head>
<div layout:fragment="container" class="container-fluid">
    <h1>SALAM</h1>
    <div>
        <form action="/admin/event/update" method="post" enctype="multipart/form-data">
            <input type="hidden" th:value="${event.id}" name="id" />

            <div class="form-group">
                <input th:value="${event.title}"  class="form-control" type="text" placeholder="title" name="title" />
            </div>
            <div class="form-group">
                <input th:value="${event.subTitle}"  class="form-control" type="text" placeholder="subTitle" name="subTitle" />
            </div>
            <div class="form-group">
                <input th:value="${event.price}"  class="form-control" type="number" placeholder="price" name="price" />
            </div>
            <div class="form-group">
                <input class="form-control" type="file" placeholder="photoUrl" name="photoFile" />
            </div>

            <input type="submit" value="Update" class="btn btn-success" />
        </form>
    </div>
</div>
</html>
