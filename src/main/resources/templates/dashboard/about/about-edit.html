<html
        xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{dashboard/layout}" lang="en">
<head>
    <title>Editing About Section</title>
</head>
<div layout:fragment="container" class="container-fluid">
    <h1>SALAM</h1>
    <div>
        <form action="/admin/about/update" method="post" enctype="multipart/form-data">
            <input type="hidden" th:value="${about.id}" name="id" />

            <div class="form-group">
                <input th:value="${about.title}"  class="form-control" type="text" placeholder="Title" name="title" />
            </div>
            <div class="form-group">
                <input th:value="${about.description}"  class="form-control" type="text" placeholder="Description" name="description" />
            </div>
            <div class="form-group">
                <input th:value="${about.videoUrl}" class="form-control" type="text" placeholder="videourl" name="videoUrl" />
            </div>
            <div class="form-group">
                <input class="form-control" type="file" placeholder="photoUrl" name="photoFile" />
            </div>
            <input type="submit" value="Update" class="btn btn-warning" />
        </form>
    </div>
</div>
</html>
