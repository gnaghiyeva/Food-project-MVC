<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ACreate Admin</title>

    <link th:href="@{/admin/css/sb-admin-2.min.css}"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h4>Create new user</h4>
        </div>

        <div class="card-body">

            <form th:action="@{/admin/users/create}"
                  th:object="${admin}"
                  method="post">

                <div class="form-group">

                    <label>Ad Soyad</label>

                    <input
                            type="text"
                            th:field="*{fullName}"
                            class="form-control"
                            required>

                </div>

                <div class="form-group">

                    <label>Username</label>

                    <input
                            type="text"
                            th:field="*{username}"
                            class="form-control"
                            required>

                </div>

                <div class="form-group">

                    <label>Parol</label>

                    <input
                            type="password"
                            th:field="*{password}"
                            class="form-control"
                            required>

                </div>

                <div class="form-group">

                    <label>Role</label>

                    <select
                            th:field="*{role}"
                            class="form-control">

                        <option
                                th:each="role : ${roles}"
                                th:value="${role}"
                                th:text="${role}">
                        </option>

                    </select>

                </div>

                <button
                        type="submit"
                        class="btn btn-primary">

                    Create

                </button>

                <a th:href="@{/admin/users}"
                   class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
