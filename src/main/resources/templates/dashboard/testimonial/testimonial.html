<html
        xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/dashboard/layout}" lang="en">
<head>
    <title>Testimonial</title>
</head>
<div layout:fragment="container" class="container-fluid">
    <a href="/admin/testimonial/testimonial-create" class="btn btn-primary btn-sm">Add</a>
    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Photo</th>
            <th scope="col">Full Name</th>
            <th scope="col">Job</th>
            <th scope="col">Thoughts</th>
            <th scope="col">Rating</th>
            <th scope="col">Edit</th>
            <th scope="col">Delete</th>
        </tr>
        </thead>
        <tbody th:each="testimonial : ${testimonials}">
        <tr>
            <th scope="row" th:text="${testimonial.id}">3</th>
            <td>
                <img width="100" height="100" th:src="@{'/uploads/' + ${testimonial.photoUrl}}" alt="photo"/>
            </td>
            <td th:text="${testimonial.fullName}">Larry</td>
            <td th:text="${testimonial.job}">Larry</td>
            <td th:text="${testimonial.thoughts}">Larry</td>
            <td th:text="${testimonial.rating}">Larry</td>
            <td>
                <a th:href="'/admin/testimonial/testimonial-edit/'+${testimonial.id}" class="btn btn-outline-warning" ><i class="fa-solid fa-pen-to-square"></i></a>
            </td>
            <td>
                <button th:onclick="'remove('+${testimonial.id}+')'" class="btn btn-outline-danger btn-sm">Delete</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<th:block layout:fragment="myScript">
    <script>
        function remove(id) {
            const swalWithBootstrapButtons = Swal.mixin({
                customClass: {
                    confirmButton: "btn btn-success",
                    cancelButton: "btn btn-danger"
                },
                buttonsStyling: false
            });
            swalWithBootstrapButtons.fire({
                title: "Are you sure?",
                text: "You won't be able to revert this!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Yes, delete it!",
                cancelButtonText: "No, cancel!",
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    swalWithBootstrapButtons.fire({
                        title: "Deleted!",
                        text: "Your file has been deleted.",
                        icon: "success"
                    });
                    window.location="/admin/testimonial/remove/"+id;
                } else if (
                    /* Read more about handling dismissals below */
                    result.dismiss === Swal.DismissReason.cancel
                ) {
                    swalWithBootstrapButtons.fire({
                        title: "Cancelled",
                        text: "Your imaginary file is safe :)",
                        icon: "error"
                    });
                }
            });
        }
    </script>

</th:block>
</html>
