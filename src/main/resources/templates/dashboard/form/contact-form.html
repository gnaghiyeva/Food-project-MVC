<html
        xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/dashboard/layout}" lang="en">
<head>
    <title>Feedbacks</title>
</head>
<div layout:fragment="container" class="container-fluid">

    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Subject</th>
            <th scope="col">Message</th>
        </tr>
        </thead>
        <tbody th:each="form : ${forms}">
        <tr>
            <th scope="row" th:text="${form.id}">3</th>
            <td th:text="${form.name}"></td>
            <td th:text="${form.email}"></td>
            <td th:text="${form.subject}"></td>
            <td th:text="${form.thoughts}"></td>

        </tr>
        </tbody>
    </table>
</div>
</html>
