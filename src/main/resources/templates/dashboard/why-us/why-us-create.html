<html
        xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/dashboard/layout}" lang="en">
<head>
    <title>Category Create</title>
</head>
<div layout:fragment="container" class="container-fluid">
    <h1>SALAM</h1>
    <div>
        <form action="/admin/why-us/create" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <input class="form-control" type="text" placeholder="Title" name="title" />
            </div>
            <div class="form-group">
                <input class="form-control" type="text" placeholder="Subtitle" name="subTitle" />
            </div>
            <div class="form-group">
                <input class="form-control" type="text" placeholder="icon" name="icon" />
            </div>
            <div class="form-group">
                <label>Ana Kart?</label><br>
                <input type="radio" name="isMain" value="true" /> Bəli<br>
                <input type="radio" name="isMain" value="false" checked /> Xeyr
            </div>

            <input type="submit" value="Create" class="btn btn-success" />
        </form>
    </div>
</div>
</html>
