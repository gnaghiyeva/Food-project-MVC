<html
        xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/dashboard/layout}" lang="en">
<head>
    <title>Products</title>
</head>
<div layout:fragment="container" class="container-fluid">
    <a href="/admin/product/product-create" class="btn btn-primary btn-sm">Adding product</a>
    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Photo</th>
            <th scope="col">Price</th>
            <th scope="col">Ingredient</th>
            <th scope="col">Category</th>
            <th scope="col">Created date</th>
            <th scope="col">Updated date</th>
            <th scope="col">Edit</th>
            <th scope="col">Delete</th>
        </tr>
        </thead>
        <tbody th:each="product : ${products}">
        <tr>
            <th scope="row" th:text="${product.id}">3</th>
            <td th:text="${product.name}">Larry</td>
            <td>
                <img width="100" height="100" th:src="@{'/uploads/' + ${product.photoUrl}}" alt="photo"/>
            </td>
            <td th:text="${product.price}">Larry</td>
            <td th:text="${product.ingredient}">Larry</td>
            <td th:text="${product.category.name}">Larry</td>
            <td th:text="${product.createdDate}"></td>
            <td th:text="${product.updatedDate}"></td>
            <td>
                <a class="btn btn-outline-warning" ><i class="fa-solid fa-pen-to-square"></i></a>
            </td>
            <td>
                <button th:onclick="'remove('+${product.id}+')'" class="btn btn-outline-danger btn-sm">Delete</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>


<th:block layout:fragment="myScript">
    <script>
        function remove(id) {
            const swalWithBootstrapButtons = Swal.mixin({
                customClass: {
                    confirmButton: "btn btn-success",
                    cancelButton: "btn btn-danger"
                },
                buttonsStyling: false
            });
            swalWithBootstrapButtons.fire({
                title: "Are you sure?",
                text: "You won't be able to revert this!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Yes, delete it!",
                cancelButtonText: "No, cancel!",
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    swalWithBootstrapButtons.fire({
                        title: "Deleted!",
                        text: "Your file has been deleted.",
                        icon: "success"
                    });
                    window.location="/admin/product/remove/"+id;
                } else if (
                    /* Read more about handling dismissals below */
                    result.dismiss === Swal.DismissReason.cancel
                ) {
                    swalWithBootstrapButtons.fire({
                        title: "Cancelled",
                        text: "Your imaginary file is safe :)",
                        icon: "error"
                    });
                }
            });
        }
    </script>

</th:block>

</html>
