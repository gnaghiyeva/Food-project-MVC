<html
        xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/dashboard/layout}" lang="en">
<head>
    <title>Category</title>
</head>
<div layout:fragment="container" class="container-fluid">
    <a href="/admin/category/category-create" class="btn btn-primary btn-sm">Add Category</a>
    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Edit</th>
        </tr>
        </thead>
        <tbody th:each="category : ${categories}">
        <tr>
            <th scope="row" th:text="${category.id}">3</th>
            <td th:text="${category.name}">Larry</td>
            <td>
                <a th:href="'/admin/category/category-edit/'+${category.id}" class="btn btn-outline-warning" ><i class="fa-solid fa-pen-to-square"></i></a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</html>
